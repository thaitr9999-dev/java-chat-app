# Test Configuration - Uses H2 in-memory database
# This profile is used by @SpringBootTest with profiles = "test"
# Tests should use H2 in-memory to avoid dependencies on PostgreSQL

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate auto-creates schema for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests (tests use auto-created schema)
spring.flyway.enabled=false

# Show SQL in test logs
spring.jpa.show-sql=true
